<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="login.css">
        <link rel="shortcut icon" href="midia/GPCfavicon.png" type="image/x-icon">
        <title>Login</title>
    </head>
    <body>
        <section class="conteudo1">
            <img src="midia/GPClogo.png" alt="logo-gpc">
            <div class="hero1">
                <div class="info-texto">
                SUA JORNADA CONTINUA
            </div>
            <h1>
                Todo passo conta.
            </h1>
            <p>
                Retome suas trilhas, conclua desafios e acompanhe a carreira que você está construindo.
            </p>
        </div>
    </section>
    <section class="conteudo2">
        <div class="hero2">
            <form id="formLogin">
                <div class="cabecalho">
                    <a href="index.html" class="btn-voltarInicio">← Voltar ao início</a>
                </div>
                <div class="area-login">
                    <h2>Que bom ter você de volta.</h2>
                    <p>Entre para continuar sua jornada.</p>
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="voce@gmail.com" required>
                    
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Digite sua senha" required>
                    
                    <a href="#" class="esqueciSenha">Esqueci minha senha</a>
                    <button type="submit" class="btn-entrar">Entrar</button>
                    <div class="btn-criarConta">
                        <p>Ainda não tem uma conta? <a href="cadastro.html">Criar conta</a></p>
                    </div>
                </div>
            </form>
        </div>
    </section>
    <script src="gpc-loader.js"></script>
<script src="login.js"></script>
</body>
</html>
